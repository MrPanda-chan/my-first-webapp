<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TODO v4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">TODO</h1>
      <p class="app__subtitle">重要度 × 期限で自動並び替え（ブラウザ保存）</p>
    </header>

    <section class="card">
      <form id="todo-form" class="form">
        <!-- 主入力 -->
        <label class="sr-only" for="todo-input">やること</label>
        <input id="todo-input" class="input input--lg" type="text" placeholder="やることを入力…" autocomplete="off" />

        <!-- 期日 -->
        <label class="sr-only" for="todo-due">期日</label>
        <input id="todo-due" class="input" type="date" />

        <!-- 重要度 -->
        <label class="sr-only" for="todo-priority">重要度</label>
        <select id="todo-priority" class="input">
          <option value="high">高</option>
          <option value="mid" selected>中</option>
          <option value="low">低</option>
        </select>

        <!-- 追加 -->
        <button type="submit" class="btn btn--mono">追加</button>
      </form>
    </section>

    <section class="listWrap">
      <ul id="todo-list" class="list"></ul>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
