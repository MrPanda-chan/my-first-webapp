<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>はじめてのWebアプリv2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>TODO</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="やること..." autocomplete="off" />
      <input id="todo-due" type="date" />
      <select id="todo-priority">
        <option value="mid" selected>中</option>
        <option value="high">高</option>
        <option value="low">低</option>
      </select>
      <button type="submit">追加</button>
    </form>    
    <ul id="todo-list"></ul>
  </main>
  <!-- (旧: カウンター / 要約プレースホルダ部は削除) -->
  <script src="main.js"></script>
</body>
</html>
